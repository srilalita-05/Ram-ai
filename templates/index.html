<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ram — Divine Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0a0805;
      --bg2:       #110e08;
      --bg3:       #1a1510;
      --gold:      #c9a84c;
      --gold-lt:   #e8c96a;
      --gold-dk:   #8a6f2e;
      --gold-glow: rgba(201,168,76,0.18);
      --crimson:   #7a1c1c;
      --text:      #e8dcc8;
      --text-dim:  #9a8a70;
      --border:    rgba(201,168,76,0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 17px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Sacred geometry background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 80% 80%, rgba(122,28,28,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 30% 30% at 20% 60%, rgba(201,168,76,0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Mandala watermark */
    body::after {
      content: '⊕';
      position: fixed;
      bottom: -120px;
      right: -120px;
      font-size: 500px;
      color: rgba(201,168,76,0.03);
      pointer-events: none;
      z-index: 0;
      line-height: 1;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 20px 40px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 48px 0 32px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .om {
      display: block;
      font-size: 42px;
      color: var(--gold);
      text-shadow: 0 0 30px rgba(201,168,76,0.6), 0 0 60px rgba(201,168,76,0.3);
      margin-bottom: 16px;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 30px rgba(201,168,76,0.6), 0 0 60px rgba(201,168,76,0.3); }
      50%       { text-shadow: 0 0 50px rgba(201,168,76,0.9), 0 0 100px rgba(201,168,76,0.5); }
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 8px;
      color: var(--gold-lt);
      text-transform: uppercase;
      line-height: 1;
    }

    .subtitle {
      font-family: 'EB Garamond', serif;
      font-style: italic;
      font-size: 16px;
      color: var(--text-dim);
      margin-top: 10px;
      letter-spacing: 2px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 20px auto 0;
      width: 320px;
      color: var(--gold-dk);
      font-size: 13px;
      letter-spacing: 3px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dk));
    }
    .divider::after { background: linear-gradient(to left, transparent, var(--gold-dk)); }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      padding: 32px 0;
      display: flex;
      flex-direction: column;
      gap: 28px;
      min-height: 300px;
    }

    .welcome {
      text-align: center;
      padding: 48px 32px;
      color: var(--text-dim);
      font-style: italic;
      font-size: 18px;
      line-height: 1.8;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: rgba(201,168,76,0.03);
    }

    .welcome strong {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-style: normal;
      letter-spacing: 3px;
      color: var(--gold-dk);
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    /* ── Messages ── */
    .message {
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-items: flex-end; }
    .message.ram  { align-items: flex-start; }

    .msg-label {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 0 4px;
    }

    .msg-bubble {
      max-width: 88%;
      padding: 16px 22px;
      line-height: 1.8;
      border-radius: 2px;
    }

    .message.user .msg-bubble {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      font-style: italic;
    }

    .message.ram .msg-bubble {
      background: linear-gradient(135deg, rgba(201,168,76,0.08), rgba(201,168,76,0.04));
      border: 1px solid rgba(201,168,76,0.3);
      border-left: 3px solid var(--gold);
      color: var(--text);
    }

    /* ── Sources ── */
    .sources {
      margin-top: 12px;
      max-width: 88%;
    }

    .sources-toggle {
      background: none;
      border: none;
      color: var(--gold-dk);
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
      padding: 4px 0;
      transition: color 0.2s;
    }
    .sources-toggle:hover { color: var(--gold); }

    .sources-list {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .sources-list.open { display: flex; }

    .source-item {
      background: var(--bg2);
      border: 1px solid rgba(201,168,76,0.12);
      border-left: 2px solid var(--gold-dk);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.6;
      border-radius: 1px;
    }
    .source-item span {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--gold-dk);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    /* ── Typing indicator ── */
    .typing {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 0;
      color: var(--text-dim);
      font-style: italic;
      font-size: 15px;
    }
    .typing-dots {
      display: flex;
      gap: 5px;
    }
    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold-dk);
      animation: dot 1.4s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1;   }
    }

    /* ── Input ── */
    .input-area {
      border-top: 1px solid var(--border);
      padding-top: 24px;
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      font-family: 'EB Garamond', serif;
      font-size: 16px;
      padding: 14px 18px;
      resize: none;
      outline: none;
      min-height: 54px;
      max-height: 160px;
      line-height: 1.6;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea::placeholder {
      color: var(--text-dim);
      font-style: italic;
    }

    textarea:focus {
      border-color: var(--gold-dk);
      box-shadow: 0 0 20px rgba(201,168,76,0.1);
    }

    .btn-send {
      background: linear-gradient(135deg, var(--gold-dk), var(--gold));
      border: none;
      border-radius: 2px;
      color: var(--bg);
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0 24px;
      height: 54px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-send:hover {
      background: linear-gradient(135deg, var(--gold), var(--gold-lt));
      box-shadow: 0 0 20px rgba(201,168,76,0.3);
    }

    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .input-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .hint {
      font-size: 12px;
      color: var(--text-dim);
      font-style: italic;
    }

    .btn-reset {
      background: none;
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 2px;
      color: var(--text-dim);
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-reset:hover {
      border-color: var(--gold-dk);
      color: var(--gold);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--gold-dk); border-radius: 2px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <span class="om">ॐ</span>
      <h1>Ram</h1>
      <p class="subtitle">Divine Wisdom from the Valmiki Ramayana</p>
      <div class="divider">✦</div>
    </header>

    <div class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <strong>॥ श्री राम ॥</strong>
        Speak your question, seeker. Whether it is about duty, loss, courage, or the path of righteousness —
        the wisdom of the Ramayana shall guide you.
      </div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <textarea
          id="questionInput"
          placeholder="Ask Ram anything about life, duty, dharma..."
          rows="1"
        ></textarea>
        <button class="btn-send" id="sendBtn" onclick="sendQuestion()">Ask</button>
      </div>
      <div class="input-footer">
        <span class="hint">Press Enter to ask · Shift+Enter for new line</span>
        <button class="btn-reset" onclick="resetConversation()">New Conversation</button>
      </div>
    </div>
  </div>

  <script>
    const chatArea = document.getElementById('chatArea');
    const input    = document.getElementById('questionInput');
    const sendBtn  = document.getElementById('sendBtn');

    // Auto-resize textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    });

    // Enter to send
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendQuestion();
      }
    });

    function removeWelcome() {
      const w = document.getElementById('welcome');
      if (w) w.remove();
    }

    function appendMessage(role, text, sources = []) {
      removeWelcome();

      const msg = document.createElement('div');
      msg.className = `message ${role}`;

      const label = document.createElement('div');
      label.className = 'msg-label';
      label.textContent = role === 'user' ? 'Seeker' : 'Ram';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;

      msg.appendChild(label);
      msg.appendChild(bubble);

      // Sources for Ram's messages
      if (role === 'ram' && sources.length > 0) {
        const sourcesDiv = document.createElement('div');
        sourcesDiv.className = 'sources';

        const toggle = document.createElement('button');
        toggle.className = 'sources-toggle';
        toggle.textContent = `✦ View ${sources.length} Source Verses`;
        toggle.onclick = () => {
          list.classList.toggle('open');
          toggle.textContent = list.classList.contains('open')
            ? `✦ Hide Source Verses`
            : `✦ View ${sources.length} Source Verses`;
        };

        const list = document.createElement('div');
        list.className = 'sources-list';

        sources.forEach(s => {
          const item = document.createElement('div');
          item.className = 'source-item';
          item.innerHTML = `<span>Sarga ${s.sarga} · Verse ${s.verse}</span>${s.translation}`;
          list.appendChild(item);
        });

        sourcesDiv.appendChild(toggle);
        sourcesDiv.appendChild(list);
        msg.appendChild(sourcesDiv);
      }

      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function showTyping() {
      const t = document.createElement('div');
      t.className = 'typing';
      t.id = 'typing';
      t.innerHTML = `
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
        Ram is reflecting...`;
      chatArea.appendChild(t);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function hideTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    async function sendQuestion() {
      const question = input.value.trim();
      if (!question) return;

      appendMessage('user', question);
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;
      showTyping();

      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });

        const data = await res.json();
        hideTyping();

        if (data.answer) {
          appendMessage('ram', data.answer, data.sources || []);
        } else {
          appendMessage('ram', 'The scripture is silent on this matter. Please ask again.');
        }
      } catch (err) {
        hideTyping();
        appendMessage('ram', 'The connection was lost. Please try again.');
      }

      sendBtn.disabled = false;
      input.focus();
    }

    async function resetConversation() {
      await fetch('/reset', { method: 'POST' });
      chatArea.innerHTML = `
        <div class="welcome" id="welcome">
          <strong>॥ श्री राम ॥</strong>
          A new conversation begins. What weighs on your heart, seeker?
        </div>`;
    }
  </script>
</body>
</html>
